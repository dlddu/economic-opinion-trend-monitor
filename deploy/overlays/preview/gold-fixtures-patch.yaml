# Mount the fixture ConfigMap at /data/gold, on top of the base emptyDir at
# /data, because the store reads <ECON_DATA_ROOT>/gold/*.jsonl. The /data mount
# drops the base's readOnly for the same reason as the e2e patch
# (tests/e2e/k8s/e2e-patch.yaml): runc has to mkdir the /data/gold mountpoint
# inside the emptyDir. Unlike e2e, the image is pulled from GHCR, so the pull
# policy is left at its default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
spec:
  template:
    spec:
      containers:
        - name: serving
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: false
            - name: gold
              mountPath: /data/gold
              readOnly: true
      volumes:
        - name: gold
          configMap:
            name: gold-fixtures
