# Set `host` to the domain the cluster routes to Traefik before applying.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: econ-serving
spec:
  ingressClassName: traefik
  rules:
    - host: econ-monitor.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: econ-serving
                port:
                  name: http
