apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: econ-monitor

resources:
  - namespace.yaml
  - ../../base
  - ../../batch
  - batch-pvc.yaml

patches:
  # Swap the data emptyDir for the shared claim. The volume is ReadWriteMany
  # and a batch Pod already mounts it alongside serving, so a rolling update
  # needs no Recreate guard.
  - target:
      kind: Deployment
      name: econ-serving
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-batch-data

  # Give the batch workflow the same claim in place of the emptyDir seam.
  # /spec/volumes is template-wide, so every stage mounts the same claim and
  # each one reads what the previous stage wrote — no per-stage patch needed as
  # stages are added.
  - target:
      group: argoproj.io
      kind: WorkflowTemplate
      name: econ-batch-pipeline
    patch: |-
      - op: replace
        path: /spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-batch-data
