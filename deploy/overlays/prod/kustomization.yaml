# Production overlay for an external cluster:
#   kubectl apply -k deploy/overlays/prod
# (or point a Flux Kustomization at this path).
#
# Adds the app namespace, pulls in the scheduled batch (deploy/batch), and
# replaces both emptyDirs with the one PVC so Gold survives Pod restarts and
# the ingestion CronJob writes into the very claim the serving Pod reads.
# Exposure (Ingress etc.) is left to the cluster's own config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: econ-monitor

resources:
  - namespace.yaml
  - ../../base
  - ../../batch
  - pvc.yaml

patches:
  # Swap the data emptyDir for the PVC, and use Recreate so a rolling update
  # never tries to attach the RWO volume from two Pods at once.
  - target:
      kind: Deployment
      name: econ-serving
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-serving-data
      - op: add
        path: /spec/strategy
        value:
          type: Recreate

  # Same swap for the ingestion CronJob: it writes Bronze into the shared claim.
  #
  # AC1.1 "주기를 설정으로 변경한다" is exercised here — to run every 30 minutes
  # instead of hourly, add to this patch:
  #     - op: replace
  #       path: /spec/schedule
  #       value: "*/30 * * * *"
  # and re-apply; the change takes effect from the next tick.
  - target:
      kind: CronJob
      name: econ-ingestion
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-serving-data
