# Adds the app namespace, pulls in the scheduled batch (deploy/batch), and
# points both emptyDir seams at the one claim: the scheduled batch writes
# Bronze -> Silver -> Gold into it and serving reads Gold from it, so what the
# hourly aggregate writes is what the dashboard shows.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: econ-monitor

resources:
  - namespace.yaml
  - ../../base
  - ../../batch
  - batch-pvc.yaml

patches:
  # Swap the data emptyDir for the shared claim. The base mount stays
  # readOnly, so serving can never touch what the batch is writing. The volume
  # is ReadWriteMany and a batch Pod already mounts it alongside serving, so a
  # rolling update needs no Recreate guard.
  - target:
      kind: Deployment
      name: econ-serving
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-batch-data

  # Give the batch workflow the same claim in place of the emptyDir seam.
  # /spec/volumes is template-wide, so every stage (ingest, analyze) mounts the
  # same claim and analysis reads the Bronze ingestion just wrote — no per-stage
  # patch needed as stages are added.
  - target:
      group: argoproj.io
      kind: WorkflowTemplate
      name: econ-batch-pipeline
    patch: |-
      - op: replace
        path: /spec/volumes/0
        value:
          name: data
          persistentVolumeClaim:
            claimName: econ-batch-data

  # AC1.1 "주기를 설정으로 변경한다" is exercised here — to run every 30 minutes
  # instead of hourly, add a patch:
  #     - target:
  #         group: argoproj.io
  #         kind: CronWorkflow
  #         name: econ-ingestion-hourly
  #       patch: |-
  #         - op: replace
  #           path: /spec/schedule
  #           value: "*/30 * * * *"
  # and re-apply; the change takes effect from the next tick.
