# Batch and serving mount this at the same time from any node, so the access
# mode has to be ReadWriteMany (README 「배포」).
# The cluster's `efs` StorageClass hands every mount the same access point
# (fixed uid/gid), so serving reads what the batch user wrote without any
# fsGroup dance on its side.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: econ-batch-data
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
