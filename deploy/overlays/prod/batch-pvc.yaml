# The one data lake volume: the scheduled batch writes Bronze -> Silver -> Gold
# into it and the serving Pod reads Gold out of it, so the two workloads must
# be able to mount it at the same time from any node — hence ReadWriteMany.
# The cluster's `efs` StorageClass hands every mount the same access point
# (fixed uid/gid), so serving reads what the batch user wrote without any
# fsGroup dance on its side.
# No storageClassName: the cluster default is used.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: econ-batch-data
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
