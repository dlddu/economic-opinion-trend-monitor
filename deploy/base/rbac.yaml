# Identity of the serving Pod, and the one thing it may do to the cluster:
# submit the batch as Workflows and read them back (go/internal/handlers/
# reprocess_trigger.go). Namespaced Role, verbs cut to exactly that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: econ-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: econ-serving-reprocess
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: econ-serving-reprocess
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: econ-serving-reprocess
subjects:
  - kind: ServiceAccount
    name: econ-serving
