# One serving Pod: API + static web at :8080. The store reads
# <ECON_DATA_ROOT>/gold/*.jsonl and treats missing files as empty datasets,
# so the base runs (empty dashboard) even before any pipeline writes Gold.
# The `data` emptyDir is the overlay seam — prod replaces it with a PVC, and
# the kind e2e leaves it in place and points ECON_DATA_ROOT at the batch claim
# it mounts beside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
spec:
  replicas: 1
  template:
    spec:
      # Why a dedicated identity: rbac.yaml.
      serviceAccountName: econ-serving
      containers:
        - name: serving
          # CI owns this tag — do not edit it by hand. Which commit production
          # actually runs is README 「운영 고정(`pin` job)」.
          # The tag is immutable, so the default imagePullPolicy (IfNotPresent) is
          # correct. Previews and e2e retag it by image name via `images:`.
          image: ghcr.io/dlddu/economic-opinion-trend-monitor:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
          env:
            - name: ECON_DATA_ROOT
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: data
          emptyDir: {}
