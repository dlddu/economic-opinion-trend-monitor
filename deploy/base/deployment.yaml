# The `data` emptyDir is the overlay seam — do not remove it. Overlays fill it (prod)
# or leave it in place and point `ECON_DATA_ROOT` elsewhere (the kind e2e).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
spec:
  replicas: 1
  template:
    spec:
      # Why a dedicated identity: rbac.yaml.
      serviceAccountName: econ-serving
      containers:
        - name: serving
          # CI owns this tag — do not edit it by hand. Which commit production
          # actually runs is README 「운영 고정(`pin` job)」.
          # The tag is immutable, so the default imagePullPolicy (IfNotPresent) is
          # correct. Previews and e2e retag it by image name via `images:`.
          image: ghcr.io/dlddu/economic-opinion-trend-monitor:a196484308b706d9803365efe03f3399f65b1544
          env:
            - name: ECON_DATA_ROOT
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: data
          emptyDir: {}
