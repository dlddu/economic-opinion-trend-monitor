# AC2.1~2.6 — 실분석 스케줄 배선. Runs the full cycle: ingest -> analyze.
#
# This supersedes `econ-ingestion-hourly`: the `pipeline` entrypoint runs the
# very same `ingest` template first, then hands its Bronze to the real
# chat-completions analyzer. The two CronWorkflows are therefore **mutually
# exclusive** — turning this one on means suspending the other, or every hour
# would collect twice.
#
#   Before unsuspending, in this order:
#     1. Confirm the `econ-llm` Secret exists in the namespace with an `api-key`
#        entry (external-secrets owns it — it is not in this repo). Without it
#        the analyze Pod never starts.
#     2. Submit one workflow by hand from `econ-batch-pipeline` with entrypoint
#        `pipeline` and confirm both steps complete: Bronze grows, and Silver is
#        rewritten with `analyzer_version: llm-v1` rather than `fake-v1`.
#     3. Read the analyze step's summary line — `attempted=` / `failed=` tells
#        you whether the model actually answered. A run where every call failed
#        exits 3 and deliberately leaves Silver untouched.
#     4. Suspend `econ-ingestion-hourly` (`/spec/suspend: true`), then unsuspend
#        this one. Doing it in that order never leaves both scheduled.
#
#   Unsuspending starts real outbound HTTP to the model endpoint for every
#   collected item, every hour — that is billable traffic, unlike ingestion.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: econ-pipeline-hourly
spec:
  suspend: true
  # Same cadence as the ingestion-only schedule it replaces (PRD-1: 매시간).
  schedule: "0 * * * *"
  timezone: "Etc/UTC"
  concurrencyPolicy: Forbid
  # Catch up a start missed by up to 30 minutes instead of skipping the cycle.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: econ-batch-pipeline
    entrypoint: pipeline
    # Two stages now, and the analyze stage is bounded by the model endpoint
    # rather than by feed fetches — but still well short of the next tick so
    # Forbid never blocks it.
    activeDeadlineSeconds: 3300
