# Mutually exclusive with `econ-ingestion-hourly` (this pipeline includes ingestion) —
# never leave both unsuspended, or every hour is collected twice.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: econ-pipeline-hourly
spec:
  suspend: false
  schedule: "0 * * * *"
  timezone: "Etc/UTC"
  concurrencyPolicy: Forbid
  # Catch up a start missed by up to 30 minutes instead of skipping the cycle.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: econ-batch-pipeline
    entrypoint: pipeline
    # Bounded by the model endpoint rather than by feed fetches, but still well
    # short of the next tick so Forbid never blocks it.
    activeDeadlineSeconds: 3300
