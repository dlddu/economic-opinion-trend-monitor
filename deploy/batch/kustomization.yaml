# Scheduled batch workloads (environment-agnostic); overlays opt in explicitly
# (README 「배포」). A scheduled batch inherited into the kind e2e overlay would
# pull a batch image that `kind load` never side-loads.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - rbac.yaml
  - workflow-template.yaml
  - cronworkflow-ingestion.yaml
  - cronworkflow-pipeline.yaml

configurations:
  - kustomizeconfig.yaml

labels:
  - includeSelectors: false
    pairs:
      app: econ-batch
