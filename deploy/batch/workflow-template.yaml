# `ingest` and `pipeline` are driven by the CronWorkflows; `reprocess` and
# `publish` are submitted by the serving Pod (deploy/base/rbac.yaml), and the
# operator input they take arrives as the `arguments.parameters` defaults below.
# The `image:` tags in this file are CI-owned — do not edit them by hand
# (README 「운영 고정(`pin` job)」).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: econ-batch-pipeline
spec:
  entrypoint: ingest
  serviceAccountName: econ-batch
  arguments:
    parameters:
      - name: version
        value: ""
      - name: since
        value: ""
      - name: axis
        value: ""
      - name: source
        value: ""
      - name: sample
        value: "0"
      - name: sample_mode
        value: random
      - name: batch
        value: "100"
      - name: decision
        value: publish
      - name: memo
        value: ""
      - name: notify
        value: "true"
  imagePullSecrets:
    - name: ghcr
  podMetadata:
    annotations:
      gitops-repository: economic-opinion-trend-monitor
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  volumes:
    # Overlay seam, mirroring deploy/base: prod swaps this for a PVC.
    - name: data
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  templates:
    - name: ingest
      retryStrategy:
        limit: "3"
        retryPolicy: Always
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        # Set explicitly (rather than relying on the image ENTRYPOINT) so the
        # emissary executor never has to look the entrypoint up from a private
        # registry.
        command: ["econ-ingestion"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # Sequential on purpose — every step reads what the previous one just wrote.
    - name: pipeline
      steps:
        - - name: ingest
            template: ingest
        - - name: analyze
            template: analyze
        - - name: aggregate
            template: aggregate

    - name: analyze
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        # Exit 2 is "the ECON_LLM_* environment is incomplete" — an operator
        # error, not a transient one. Retrying it just burns the backoff and
        # buries the message, so stop after the first attempt.
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-analysis"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
          - name: ECON_LLM_BASE_URL
            value: https://api.openai.com/v1
          - name: ECON_LLM_MODEL
            value: gpt-5.6-luna
          # GPT-5.x rejects any temperature but its own default (400
          # unsupported_value), so the field is omitted rather than pinned to 0.
          - name: ECON_LLM_TEMPERATURE
            value: default
          # Declared required (not `optional`) so a missing Secret stops the
          # Pod loudly instead of letting it start and exit 2 on every retry.
          - name: ECON_LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: econ-llm
                key: api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # Retrying is safe even though every call is billable: the CLI checkpoints
    # every `batch` records and skips what the target version already covers,
    # so a retry resumes instead of starting over.
    - name: reprocess
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-analysis"]
        args:
          - --analyzer-version
          - "{{workflow.parameters.version}}"
          - --since
          - "{{workflow.parameters.since}}"
          - --axis
          - "{{workflow.parameters.axis}}"
          - --source
          - "{{workflow.parameters.source}}"
          - --sample
          - "{{workflow.parameters.sample}}"
          - --sample-mode
          - "{{workflow.parameters.sample_mode}}"
          - --batch-size
          - "{{workflow.parameters.batch}}"
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
          - name: ECON_LLM_BASE_URL
            value: https://api.openai.com/v1
          - name: ECON_LLM_MODEL
            value: gpt-5.6-luna
          - name: ECON_LLM_TEMPERATURE
            value: default
          - name: ECON_LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: econ-llm
                key: api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # Nothing is re-analyzed here, so a retry is safe.
    - name: publish
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        # Exit 2 is a refused decision (no memo, no version) — retrying it
        # cannot succeed.
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-aggregation"]
        args:
          - --decision
          - "{{workflow.parameters.decision}}"
          - --version
          - "{{workflow.parameters.version}}"
          - --memo
          - "{{workflow.parameters.memo}}"
          - --notify-consumer
          - "{{workflow.parameters.notify}}"
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # Pure recomputation over the shared volume — no network, no model calls —
    # so a retry here is always safe and never billable.
    - name: aggregate
      retryStrategy:
        limit: "3"
        retryPolicy: Always
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-aggregation"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp
