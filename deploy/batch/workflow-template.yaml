# Two entrypoints on purpose. `ingest` is what the live hourly CronWorkflow has
# always called and is kept exactly as it was; `pipeline` chains ingest ->
# analyze for the cutover to the real analyzer, and is driven by a *separate*
# CronWorkflow that ships suspended (see cronworkflow-pipeline.yaml). Adding
# templates changes nothing on its own — a template nobody invokes never runs.
#
# Two more, `reprocess` and `publish`, are invoked by the serving Pod rather
# than by a schedule (deploy/base/rbac.yaml); their operator input arrives as
# workflow parameters — `arguments.parameters` below are the defaults a bare
# submit gets.
#
# `imagePullSecrets` is declared here rather than left to the cluster: the
# batch image is a private GHCR package, and the cluster's imagePullSecret
# patch is scoped to the serving Deployment, so a batch Pod would otherwise
# never receive it. The `ghcr` Secret itself is injected into the namespace by
# external-secrets.
#
# The `image:` tags in this file are CI-owned and move in step with the serving
# image in deploy/base — do not edit them by hand (README 「운영 고정(`pin` job)」).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: econ-batch-pipeline
spec:
  entrypoint: ingest
  serviceAccountName: econ-batch
  arguments:
    parameters:
      # reprocess: scope + how to run it (JRN-logic-backfill STP-dry-run / STP-run-reprocess)
      - name: version
        value: ""
      - name: since
        value: ""
      - name: axis
        value: ""
      - name: source
        value: ""
      - name: sample
        value: "0"
      - name: sample_mode
        value: random
      - name: batch
        value: "100"
      # publish: the decision and its reason (STP-publish)
      - name: decision
        value: publish
      - name: memo
        value: ""
      - name: notify
        value: "true"
  imagePullSecrets:
    - name: ghcr
  podMetadata:
    annotations:
      gitops-repository: economic-opinion-trend-monitor
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    # Hand the mounted data volume to the batch user on attach.
    fsGroup: 65532
  volumes:
    # Overlay seam, mirroring deploy/base: prod swaps this for a PVC.
    - name: data
      emptyDir: {}
    - name: tmp
      emptyDir: {}
  templates:
    # AC1.1 "실행 누락 시 재시도" — Argo-native per-step retries.
    - name: ingest
      retryStrategy:
        limit: "3"
        retryPolicy: Always
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        # Set explicitly (rather than relying on the image ENTRYPOINT) so the
        # emissary executor never has to look the entrypoint up from a private
        # registry. No args: the default source is the real feed list and the
        # cycle defaults to the current UTC hour. Add e.g.
        # ["--cycle", "2026-06-23T14:00"] to backfill a specific window.
        command: ["econ-ingestion"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # One full cycle: collect into Bronze, enrich that Bronze into Silver, then
    # aggregate that Silver into Gold. Sequential on purpose — every step reads
    # what the previous one just wrote, and all three share the one `data`
    # volume declared above.
    - name: pipeline
      steps:
        - - name: ingest
            template: ingest
        - - name: analyze
            template: analyze
        - - name: aggregate
            template: aggregate

    # AC2.1-2.6 "실분석 -> 실 Silver". No args: the analyzer default is the real
    # model, exactly as the ingest step relies on the real-feed default.
    - name: analyze
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        # Exit 2 is "the ECON_LLM_* environment is incomplete" — an operator
        # error, not a transient one. Retrying it just burns the backoff and
        # buries the message, so stop after the first attempt.
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-analysis"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
          - name: ECON_LLM_BASE_URL
            value: https://api.openai.com/v1
          - name: ECON_LLM_MODEL
            value: gpt-5.6-luna
          # GPT-5.x rejects any temperature but its own default (400
          # unsupported_value), so the field is omitted rather than pinned to 0.
          - name: ECON_LLM_TEMPERATURE
            value: default
          # The key is the one piece that cannot live in git. Like the `ghcr`
          # pull secret, the `econ-llm` Secret is injected into the namespace by
          # external-secrets; this manifest only names it. Declared required
          # (not `optional`) so a missing Secret stops the Pod loudly instead of
          # letting the container start and exit 2 every retry.
          - name: ECON_LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: econ-llm
                key: api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # JRN-logic-backfill STP-dry-run / STP-run-reprocess. `sample` > 0 is the
    # dry run; 0 is the full run. The CLI checkpoints every `batch` records and
    # skips what the target version already covers, so a retry of this step
    # resumes instead of starting over — which is why the retry is safe here
    # even though every call is billable.
    - name: reprocess
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-analysis"]
        args:
          - --analyzer-version
          - "{{workflow.parameters.version}}"
          - --since
          - "{{workflow.parameters.since}}"
          - --axis
          - "{{workflow.parameters.axis}}"
          - --source
          - "{{workflow.parameters.source}}"
          - --sample
          - "{{workflow.parameters.sample}}"
          - --sample-mode
          - "{{workflow.parameters.sample_mode}}"
          - --batch-size
          - "{{workflow.parameters.batch}}"
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
          - name: ECON_LLM_BASE_URL
            value: https://api.openai.com/v1
          - name: ECON_LLM_MODEL
            value: gpt-5.6-luna
          - name: ECON_LLM_TEMPERATURE
            value: default
          - name: ECON_LLM_API_KEY
            valueFrom:
              secretKeyRef:
                name: econ-llm
                key: api-key
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # JRN-logic-backfill STP-publish — record the decision and rebuild Gold
    # from it. Nothing is re-analyzed here, so a retry is safe.
    - name: publish
      retryStrategy:
        limit: "3"
        retryPolicy: Always
        # Exit 2 is a refused decision (no memo, no version) — retrying it
        # cannot succeed.
        expression: "lastRetry.exitCode != '2'"
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-aggregation"]
        args:
          - --decision
          - "{{workflow.parameters.decision}}"
          - --version
          - "{{workflow.parameters.version}}"
          - --memo
          - "{{workflow.parameters.memo}}"
          - --notify-consumer
          - "{{workflow.parameters.notify}}"
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp

    # AC3.2 "핵심 서술 대상 기준 집계" — Silver -> Gold. No args: the CLI defaults
    # to $ECON_DATA_ROOT and rewrites both Gold datasets from whatever Silver it
    # finds.
    #
    # Pure recomputation over the shared volume — no network, no model calls —
    # so a retry here is always safe and never billable.
    - name: aggregate
      retryStrategy:
        limit: "3"
        retryPolicy: Always
      container:
        image: ghcr.io/dlddu/economic-opinion-trend-monitor-batch:b5a91d64132381dc8c0cb22abb1e5d5e08c77f4b
        command: ["econ-aggregation"]
        args: []
        env:
          - name: ECON_RUN_ID
            value: "{{workflow.name}}"
          - name: ECON_DATA_ROOT
            value: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
          - name: data
            mountPath: /data
          - name: tmp
            mountPath: /tmp
