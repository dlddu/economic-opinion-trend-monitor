# Runs one ingestion cycle per schedule tick. `econ-ingestion` derives the
# cycle id from the current UTC hour when --cycle is omitted and is idempotent
# per cycle, so a tick that runs late still lands in the right cycle bucket.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: econ-ingestion-hourly
spec:
  suspend: true
  schedule: "0 * * * *"
  timezone: "Etc/UTC"
  concurrencyPolicy: Forbid
  # Catch up a start missed by up to 30 minutes instead of skipping the cycle.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: econ-batch-pipeline
    entrypoint: ingest
    # Give up well before the next tick so Forbid never blocks it.
    activeDeadlineSeconds: 3000
