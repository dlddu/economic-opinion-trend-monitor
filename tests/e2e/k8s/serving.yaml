# e2e serving stack: one serving Pod reading fixture Gold from a ConfigMap.
#
# The image is built locally and side-loaded with `kind load docker-image`
# (imagePullPolicy: Never — no registry involved). The `gold-fixtures`
# ConfigMap is created by run.sh from tests/e2e/fixtures/gold and mounted at
# /data/gold because the store reads <ECON_DATA_ROOT>/gold/*.jsonl.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
  labels:
    app: econ-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econ-serving
  template:
    metadata:
      labels:
        app: econ-serving
    spec:
      containers:
        - name: serving
          image: econ-monitor:e2e
          imagePullPolicy: Never
          env:
            - name: ECON_DATA_ROOT
              value: /data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: gold
              mountPath: /data/gold
              readOnly: true
      volumes:
        - name: gold
          configMap:
            name: gold-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: econ-serving
spec:
  selector:
    app: econ-serving
  ports:
    - name: http
      port: 8080
      targetPort: http
