# Overlay deploy/base here rather than standing up an e2e copy of it — applying the
# deployable base in CI is what keeps it honest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../deploy/base

images:
  - name: ghcr.io/dlddu/economic-opinion-trend-monitor
    newName: econ-monitor
    newTag: e2e

patches:
  - path: e2e-patch.yaml
