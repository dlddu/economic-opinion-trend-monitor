# `ECON_RUN_ID` 가 앞 실행과 **달라야** 두 실행이 두 레코드로 갈린다. 이 Job 은 성공(completed)이
# 기대값이다 — 중단되는 것은 수집이 아니라 다음 단계(`analyze-job-ops-stopped.yaml`)다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-ops-2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-23 — 중단 실행의 상류를 후속 주기 전용 설정(`e2e-feeds-ops-2.json`)으로 돌린다(상류 재배선 — 「앞 실행이 다루지 않은 기사」를 실 상류에서는 고를 수 없다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-ops-2.json
            - --cycle
            - "2026-04-01T10:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/pipeline-ops
            - name: ECON_RUN_ID
              value: e2e-ops-run-stopped
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-24 — 중단 실행의 수집 Job 이 피드 설정·픽스처를 같은 ConfigMap 으로 받는다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
