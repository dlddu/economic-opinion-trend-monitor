# 호출 기록 묶음(`…-test-pipeline-ops.md#시나리오 2`)의 **주기 2** 수집 — 관측 대상인 본 실행의 입력.
# `--cycle` 이 주기 1과 **달라야** 하고, 피드의 겹치는 세 건은 **같아야** 한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-calls2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-26 — 호출 기록 묶음 주기 2 의 상류를 전용 설정(`e2e-feeds-calls2.json`)으로 돌린다(상류 재배선) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-calls2.json
            - --cycle
            - "2026-02-05T01:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/llm-calls
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-28 — 수집 CLI가 읽는 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
