# 스크립트는 ConfigMap `rollup-timeshift` 로 들어온다(run.sh 가 `tests/e2e/tools/` 에서 만든다) —
# 배치 이미지는 **운영 이미지**라 e2e 전용 하네스 코드를 굽지 않는다.
#
# 인터프리터를 venv 경로(`/app/.venv/bin/python`)로 **못박는다**. `econ_core` 는 `Dockerfile.batch` 의
# venv 에만 있어 `python3` 가 시스템 인터프리터로 잡히면 `ModuleNotFoundError` 로 죽는데, 그 실패는
# 「하네스 배선이 틀렸다」가 아니라 「코퍼스가 이상하다」처럼 읽힌다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-timeshift-rollup
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: timeshift
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["/app/.venv/bin/python", "/scripts/timeshift_bronze.py"]
          args:
            - --from
            - /data/aggregation
            - --to
            - /data/aggregation-rollup
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: scripts
          configMap:
            name: rollup-timeshift
        - name: tmp
          emptyDir: {}
