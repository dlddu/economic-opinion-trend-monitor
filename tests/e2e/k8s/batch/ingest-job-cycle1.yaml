# 주기를 Job 셋으로 나눈 것은 운영 컨테이너 계약을 그대로 두기 위해서다 — 운영의 한 주기는
# `econ-ingestion` 한 번(deploy/batch/workflow-template.yaml 의 `ingest`)이고, command 를 쉘 루프로
# 바꾸면 e2e 가 검증하는 것이 제품 계약이 아니게 된다.
#
# 세 Job 은 **순차로, 같은 루트**(`/data/cycles`)에서 돌아야 한다 — 본문 저장소가 주기를 가로질러
# 누적되는 것이 관측 대상이고, 동시에 돌면 `first_seen_cycle` 이 비결정적이 된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-cycle1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-10 — 주기마다 내용이 달라지는 상류로 수집 CLI를 돌린다(실 상류로는 "같은 기사의 본문이 3주기째에 수정된다"를 만들 수 없다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-cycle12.json
            - --cycle
            - "2026-02-01T00:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/cycles
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-09 — 주기별 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
