# 루트 `/data/pipeline-ops` 를 새로 판다 — 기존 루트에 얹으면 이미 쌓인 Silver 가 분석 단계의
# `skipped_settled` 로 들어와 「앞 단계 출력 = 다음 단계 입력」이 성립하지 않는다.
#
# 상류 `e2e-feeds-ops.json` 은 집계 묶음의 세 소스에 **항상 실패하는 소스**(`e2e-ops-down`)를 더한다
# — 시나리오가 실패 소스 기록을 요구하는데, 집계 루트에 넣으면 run.sh 의 `failed_sources=[]` 가드에 걸린다.
#
# `ECON_RUN_ID` 는 세 단계를 **한 실행 기록**에 접는 유일한 배선이다(운영에서는 Argo 가
# `{{workflow.name}}` 을 넣는다).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-ops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-21 — 이 실행의 상류를 실행 기록 묶음 전용 설정(`e2e-feeds-ops.json`)으로 돌린다(상류 재배선 — 실패 소스 1개 포함) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-ops.json
            - --cycle
            - "2026-04-01T09:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/pipeline-ops
            - name: ECON_RUN_ID
              value: e2e-ops-run-ok
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-22 — 실행 기록 묶음의 수집 Job 이 피드 설정·픽스처를 같은 ConfigMap 으로 받는다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
