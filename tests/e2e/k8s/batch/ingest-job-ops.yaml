# `…-test-pipeline-ops.md#시나리오 1`(실행·단계 기록과 건수 정합)의 **정상 실행**, 첫 단계.
#
# 컨테이너 계약은 ingest-job.yaml 과 같다(같은 배치 이미지 · `econ-ingestion` · 제품 CLI).
# 다른 것은 셋이다:
#
#   * 데이터 루트 — `/data/pipeline-ops`. 이 루트는 「한 실행이 세 단계를 지나간 기록」 하나를
#     만드는 것이 목적이라 다른 묶음과 섞일 수 없다. 기존 루트에 얹으면 그 루트에 이미 쌓인
#     Silver 가 분석 단계의 `skipped_settled` 로 들어와 「앞 단계 출력 = 다음 단계 입력」이
#     성립하지 않는다.
#   * 상류 — `e2e-feeds-ops.json`. 집계 묶음과 같은 세 소스에 **항상 실패하는 네 번째 소스**
#     (`e2e-ops-down`, 더블의 `/__fail__/`)를 더했다. 시나리오가 「실패 소스와 사유가 수집
#     단계에 기록된다」를 기대 결과로 요구하므로 정상 실행 안에 실패 소스가 **있어야** 한다.
#     기존 집계 루트에 이 소스를 넣는 대신 루트를 새로 판 이유가 이것이다 — 그쪽은 run.sh 의
#     `failed_sources=[]` 가드가 이미 착지한 집계 spec 들을 지키고 있다.
#   * `ECON_RUN_ID` — 세 단계가 **한 실행 기록**에 접히게 하는 유일한 배선. 운영에서는 Argo
#     WorkflowTemplate 이 `{{workflow.name}}` 을 같은 이름으로 넣는다(deploy/batch/).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-ops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-21 — 이 실행의 상류를 실행 기록 묶음 전용 설정(`e2e-feeds-ops.json`)으로 돌린다(상류 재배선 — 실패 소스 1개 포함) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-ops.json
            - --cycle
            - "2026-04-01T09:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/pipeline-ops
            - name: ECON_RUN_ID
              value: e2e-ops-run-ok
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-22 — 실행 기록 묶음의 수집 Job 이 피드 설정·픽스처를 같은 ConfigMap 으로 받는다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
