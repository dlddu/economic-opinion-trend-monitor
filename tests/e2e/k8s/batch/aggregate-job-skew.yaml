# 부풀린 상태의 집계. 기준 상태(`aggregate-job.yaml`)와 루트만 다르다 — 같은 코드가 같은
# 설정으로 돌아야 두 Gold 의 차이가 집계 로직의 변덕이 아니라 입력량 차이로 읽힌다.
#
# 두 상태를 각자의 루트에서 **완결된 Gold 로** 남기는 것이 요지다. 한 루트에서 두 번 돌리면
# `write_records` 가 데이터셋을 교체해 기준 상태가 사라지고 비교할 대상이 없어진다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-aggregate-skew
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: aggregate
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-aggregation"]
          args: []
          env:
            - name: ECON_DATA_ROOT
              value: /data/aggregation-skew
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
