# 분석 배치 한 번. 운영에서 이 CLI를 도는 것은 deploy/batch/workflow-template.yaml 의
# `analyze` 템플릿이고, 여기서는 그 컨테이너 계약(같은 배치 이미지 · `econ-analysis` 커맨드 ·
# ECON_DATA_ROOT · ECON_LLM_* 환경)을 그대로 옮긴 평범한 Job으로 돈다. 바뀌는 것은
# `ECON_LLM_BASE_URL` 이 가리키는 곳뿐이다 — 분석 로직은 제품 경로 그대로 돈다.
#
# 인자를 주지 않으므로 분석기는 기본값인 **실 llm 분석기**다(`--analyzer fake` 가 아니다).
# 페이크 분석기로 돌리면 프롬프트 조립·응답 파싱·정규화 경로가 통째로 빠져 이 묶음이 검증하려는
# 계약이 한 번도 실행되지 않는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args: []
          # mock-exception: LLM-05 — chat-completions 상류를 클러스터 안 LLM 더블로 돌린다(BASE_URL·MODEL·더미 KEY 한 묶음: 실 모델은 응답이 비결정적이고 키·과금·네트워크를 CI에 끌고 들어온다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/analysis
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            # 더블의 응답 묶음을 고르는 이름. 실 모델 이름 자리다.
            - name: ECON_LLM_MODEL
              value: e2e-llm-v1
            # 운영에서는 external-secrets가 넣는 `econ-llm` Secret에서 온다. 더블은 키를 보지
            # 않지만 CLI가 미설정을 operator error(exit 2)로 끊으므로 값이 있어야 한다.
            # 비밀이 아닌 고정 문자열이며, 실 엔드포인트에는 쓰이지 않는다.
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
