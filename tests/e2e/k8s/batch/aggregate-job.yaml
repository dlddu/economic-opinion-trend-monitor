# 배치 이미지의 ENTRYPOINT 는 `econ-ingestion` 이라 집계는 `command` 로 덮어써야 한다
# (`args` 만 바꾸면 수집 CLI 에 집계 인자가 넘어간다).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-aggregate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: aggregate
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-aggregation"]
          args: []
          env:
            - name: ECON_DATA_ROOT
              value: /data/aggregation
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
