# 컨테이너 계약은 수집·분석 Job 과 같다(같은 배치 이미지 · `ECON_DATA_ROOT` · 같은 PVC ·
# readOnlyRootFilesystem + `/tmp` emptyDir). 바뀌는 것은 커맨드뿐이다 — 배치 이미지의
# ENTRYPOINT 는 `econ-ingestion` 이라 집계는 `command` 로 덮어써야 한다(`analyze-job.yaml` 이
# `econ-analysis` 를 덮어쓰는 것과 같다).
#
# 상류 더블이 필요 없다 — 집계는 네트워크를 타지 않고 같은 루트의 Bronze·Silver 만 읽는다.
# 그래서 이 Job 에는 mock-exception 주석이 붙지 않는다(주입하는 상류가 없다).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-aggregate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: aggregate
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-aggregation"]
          args: []
          env:
            - name: ECON_DATA_ROOT
              value: /data/aggregation
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
