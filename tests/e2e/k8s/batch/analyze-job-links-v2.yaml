# 연결 기록 묶음(`…-test-pipeline-ops.md#시나리오 3`)의 **범위 지정 재처리**.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-links-v2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args:
            - --analyzer-version
            - llm-v4
            # `--source` 를 빼면 범위 없는 전체 재처리가 되어 앞 버전 행이 사라진다
            # (`run.sh` 의 `coexisting` 가드가 그 자리다).
            - --source
            - e2e-links-desk
          # mock-exception: LLM-16 — 연결 기록 묶음의 chat-completions 상류를 같은 LLM 더블로 돌린다(BASE_URL·MODEL·더미 KEY 한 묶음) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/record-links
            - name: ECON_RUN_ID
              value: e2e-links-run-3
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            - name: ECON_LLM_MODEL
              value: e2e-llm-links
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
