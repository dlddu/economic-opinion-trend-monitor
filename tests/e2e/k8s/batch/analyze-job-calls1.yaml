apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-calls1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args: []
          # mock-exception: LLM-11 — 호출 기록 묶음의 chat-completions 상류를 같은 LLM 더블로 돌린다(BASE_URL·MODEL·더미 KEY 한 묶음) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/llm-calls
            - name: ECON_RUN_ID
              value: e2e-calls-run-1
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            # 이 묶음 전용 응답 표. 주기 2 분석과 **같은 이름**이어야 한다 — 응답 캐시 키가
            # (analyzer_version, model, system, user) 라 모델 이름이 달라지면 재사용이 일어나지 않는다.
            - name: ECON_LLM_MODEL
              value: e2e-llm-calls
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
