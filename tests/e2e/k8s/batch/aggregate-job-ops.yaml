# `…-test-pipeline-ops.md#시나리오 1` **정상 실행**의 마지막 단계.
#
# 컨테이너 계약은 aggregate-job.yaml 과 같고 바뀌는 것은 데이터 루트와 `ECON_RUN_ID` 뿐이다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-aggregate-ops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: aggregate
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-aggregation"]
          args: []
          env:
            - name: ECON_DATA_ROOT
              value: /data/pipeline-ops
            - name: ECON_RUN_ID
              value: e2e-ops-run-ok
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
