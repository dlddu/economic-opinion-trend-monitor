# `--analyzer-version` 을 주지 않는다 — 주기 1 과 **같은 버전**이어야 캐시 키가 맞는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-links2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args: []
          # mock-exception: LLM-15 — 연결 기록 묶음의 chat-completions 상류를 같은 LLM 더블로 돌린다(BASE_URL·MODEL·더미 KEY 한 묶음) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/record-links
            - name: ECON_RUN_ID
              value: e2e-links-run-2
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            # 주기 1 분석과 같은 이름이어야 한다(`analyze-job-links1.yaml` 이 근거를 적는다).
            - name: ECON_LLM_MODEL
              value: e2e-llm-links
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
