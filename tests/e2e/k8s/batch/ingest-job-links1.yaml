# 연결 기록 묶음(`…-test-pipeline-ops.md#시나리오 3`)의 **주기 1** 수집.
#
# desk 2건(정상·저신뢰) + wire 2건(본문 없음·다음 주기 재관측 대상)을 한 주기로 들인다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-links1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-29 — 연결 기록 묶음 2026-03-02T00:00 주기의 상류를 전용 설정(`e2e-feeds-links1.json`)으로 돌린다(상류 재배선) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-links1.json
            - --cycle
            - "2026-03-02T00:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/record-links
            # 수집과 분석을 **한 실행 id** 로 묶는다 — 운영에서 Argo 가 `{{workflow.name}}` 을
            # 모든 스텝에 넣는 그 변수다. 그래야 실행 레코드가 두 단계를 다 갖고, 시나리오 3 의
            # 「레코드 → 실행 기록 도달」이 자동 생성 id 가 아닌 결정적 id 로 관측된다.
            - name: ECON_RUN_ID
              value: e2e-links-run-1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-30 — 수집 CLI가 읽는 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
