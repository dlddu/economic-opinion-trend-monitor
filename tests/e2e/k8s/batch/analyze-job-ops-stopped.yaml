# 이 Job 은 **실패(failed)하는 것이 기대값**이다. `ECON_LLM_BASE_URL` 이 해석되지 않는 이름
# (`econ-llm-absent.invalid`, RFC 2606 예약 TLD)을 가리켜 호출이 전건 `CompletionError` 로 떨어지고
# 분석 CLI 가 종료 코드 3(`EXIT_ALL_CALLS_FAILED`)으로 끊는다. `backoffLimit: 0` — 재시도해도 같다.
#
# 더블의 404 경로를 재사용하지 않는다: 그 404 는 「픽스처가 낡았다」를 드러내는 신호라
# (fixtures/llm/server.py), 의도적 실패와 신호를 공유하면 픽스처가 실제로 낡은 날 이 Job 이 그것을 숨긴다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-ops-stopped
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args: []
          # mock-exception: LLM-10 — 중단 실행의 chat-completions 상류를 해석되지 않는 주소로 돌려 호출 전건 실패를 주입한다(실 모델에 「전부 실패하라」를 주문할 수 없다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/pipeline-ops
            - name: ECON_RUN_ID
              value: e2e-ops-run-stopped
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-absent.invalid:8080/v1
            - name: ECON_LLM_MODEL
              value: e2e-llm-agg
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
