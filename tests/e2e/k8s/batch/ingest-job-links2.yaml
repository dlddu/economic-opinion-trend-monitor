# 연결 기록 묶음(`…-test-pipeline-ops.md#시나리오 3`)의 **주기 2** 수집.
#
# desk 는 주기 1 과 **겹치지 않는** 새 기사 한 건, wire 는 주기 1 의 두 건을 **바이트 동일하게**
# 다시 싣고 응답 없는 기사 하나를 더한다 — 재관측분이 응답 캐시를 맞혀 `reused` 를 만들고,
# 응답 없는 기사가 이 묶음의 유일한 `call_failed` 가 된다(픽스처 머리말 참조).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-links2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-31 — 연결 기록 묶음 2026-03-02T01:00 주기의 상류를 전용 설정(`e2e-feeds-links2.json`)으로 돌린다(상류 재배선) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-links2.json
            - --cycle
            - "2026-03-02T01:00"
          env:
            - name: ECON_DATA_ROOT
              value: /data/record-links
            # 수집과 분석을 **한 실행 id** 로 묶는다 — 운영에서 Argo 가 `{{workflow.name}}` 을
            # 모든 스텝에 넣는 그 변수다. 그래야 실행 레코드가 두 단계를 다 갖고, 시나리오 3 의
            # 「레코드 → 실행 기록 도달」이 자동 생성 id 가 아닌 결정적 id 로 관측된다.
            - name: ECON_RUN_ID
              value: e2e-links-run-2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-32 — 수집 CLI가 읽는 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
