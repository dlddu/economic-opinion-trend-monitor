# Job 컨테이너는 종료하면 파일시스템째 사라지므로 산출물은 emptyDir 이 아니라 클레임에 둔다.
# kind 기본 StorageClass(local-path)가 단일 노드에서 채우고, ReadWriteOnce 는 노드 단위라 같은
# 노드의 반출 Pod·서빙 Pod 가 동시에 마운트할 수 있다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: econ-e2e-batch-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
