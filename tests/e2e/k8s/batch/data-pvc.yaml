# 배치가 쓴 Bronze를 Job이 끝난 뒤에도 읽을 수 있게 붙잡아 두는 볼륨. Job 컨테이너는
# 종료하면 파일시스템째 사라지므로 emptyDir로는 산출물을 꺼낼 수 없다. kind의 기본
# StorageClass(local-path)가 단일 노드에서 이 클레임을 채우고, 같은 노드의 반출 Pod가
# 같은 클레임을 읽는다(ReadWriteOnce는 노드 단위라 동시 마운트가 성립한다).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: econ-e2e-batch-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
