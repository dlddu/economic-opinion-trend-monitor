apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-llm-double
  labels:
    app: econ-llm-double
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econ-llm-double
  template:
    metadata:
      labels:
        app: econ-llm-double
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: llm-double
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          # mock-exception: LLM-04 — 실 chat-completions 모델 대신 고정 응답 서버를 돈다(응답이 매 호출 달라지면 라벨 전파를 단언할 대상이 없다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          command: ["python", "/llm/server.py", "8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            # 픽스처 로드까지 확인한다 — 포트만 열린 상태로 Ready가 되면 분석 Job이
            # 응답 표 없이 출발해 전건 실패로 끝난다.
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: llm
              mountPath: /llm
              readOnly: true
      volumes:
        - name: llm
          configMap:
            # mock-exception: LLM-03 — 더블이 돌려줄 기사별 응답을 ConfigMap으로 주입한다(실 모델 응답은 비결정적) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: llm-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: econ-llm-double
spec:
  selector:
    app: econ-llm-double
  ports:
    - port: 8080
      targetPort: 8080
