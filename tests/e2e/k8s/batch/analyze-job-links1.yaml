# 연결 기록 묶음(`…-test-pipeline-ops.md#시나리오 3`)의 **주기 1 분석**.
#
# `--analyzer-version` 을 주지 않는다 — 기본(llm-v1)이 병존 비교의 **앞 버전**이다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-links1
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args: []
          # mock-exception: LLM-14 — 연결 기록 묶음의 chat-completions 상류를 같은 LLM 더블로 돌린다(BASE_URL·MODEL·더미 KEY 한 묶음) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/record-links
            - name: ECON_RUN_ID
              value: e2e-links-run-1
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            # 세 분석 Job 이 같은 이름을 써야 응답 캐시 키가 맞는다(재사용 갈래가 여기 걸린다).
            - name: ECON_LLM_MODEL
              value: e2e-llm-links
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
