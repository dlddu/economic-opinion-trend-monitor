# run.sh 가 `kubectl exec … cat` 으로 PVC 의 산출물을 꺼내 가는 대기 Pod — 읽기만 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-bronze-shell
  labels:
    app: econ-bronze-shell
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econ-bronze-shell
  template:
    metadata:
      labels:
        app: econ-bronze-shell
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: shell
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
