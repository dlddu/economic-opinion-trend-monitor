apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-feed-double
  labels:
    app: econ-feed-double
spec:
  replicas: 1
  selector:
    matchLabels:
      app: econ-feed-double
  template:
    metadata:
      labels:
        app: econ-feed-double
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: feed-double
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          # mock-exception: FEED-06 — 실 상류의 오류·타임아웃·중복 노출을 관측하려면 상류가 그 행위를 내야 해 고장 주입 더블을 돈다 — docs/econ-opinion-monitor-e2e-mocking-policy.md
          command: ["python", "/feeds/server.py", "8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /kr_wire.rss.xml
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: feeds
              mountPath: /feeds
              readOnly: true
      volumes:
        - name: feeds
          configMap:
            # mock-exception: FEED-03 — 실 RSS/Atom 상류는 가용성·내용이 비결정적이라 고정 피드 픽스처를 더블이 서빙한다 — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: econ-feed-double
spec:
  selector:
    app: econ-feed-double
  ports:
    - port: 8080
      targetPort: 8080
