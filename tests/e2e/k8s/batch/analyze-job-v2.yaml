# 같은 Bronze 원문을 **다시** 분석한다 — `…-test-analysis.md#시나리오 6` 의 「분석 로직을
# 변경해 동일 Bronze 원문을 재분석한다」에 해당하는 자리다.
#
# 두 가지가 앞 Job과 다르다: 더블의 응답 묶음을 `e2e-llm-v2` 로 바꾸고(몇 건을 다시 판정한다),
# `--analyzer-version` 을 `llm-v4` 로 올린다. 데이터 루트는 **같다** — 재분석은 새 데이터셋을
# 만드는 것이 아니라 같은 Silver를 갱신하는 것이고, 그 갱신이 추적 키를 잃지 않는지가 시나리오의
# 기대 결과이기 때문이다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-analyze-v2
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: analyze
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-analysis"]
          args:
            - --analyzer-version
            - llm-v4
          # mock-exception: LLM-06 — 재분석 주기의 chat-completions 상류도 같은 더블로 돌린다(응답 묶음만 v2로 바꿔 「분석 로직 변경」을 세운다) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          env:
            - name: ECON_DATA_ROOT
              value: /data/analysis
            - name: ECON_LLM_BASE_URL
              value: http://econ-llm-double:8080/v1
            - name: ECON_LLM_MODEL
              value: e2e-llm-v2
            - name: ECON_LLM_API_KEY
              value: e2e-double-not-a-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: tmp
          emptyDir: {}
