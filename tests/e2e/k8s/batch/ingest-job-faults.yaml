# `--fetch-timeout 1` 은 더블의 `/__slow__/5/` 지연보다 짧아야 한다 — 5 이상으로 올리면 느린
# 소스가 그냥 성공해 타임아웃 경로가 관측되지 않는다.
# 한 소스가 끝내 실패해도 이 Job 은 **성공(completed)하는 것이 기대값**이다(실패는 `failed_sources`).
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-faults
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-08 — 오류·지연·중복을 내는 상류로 수집 CLI를 돌린다(실 상류로는 장애 주입 자체가 불가) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-faults.json
            - --cycle
            - "2026-01-02T00:00"
            - --fetch-timeout
            - "1"
          env:
            - name: ECON_DATA_ROOT
              value: /data/faults
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-07 — 고장 주입 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
