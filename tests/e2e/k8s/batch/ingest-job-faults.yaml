# `…-test-ingestion.md#시나리오 6`(실패·중복·부분 장애 격리) 전용 수집 주기.
#
# 컨테이너 계약은 ingest-job.yaml 과 같다(같은 배치 이미지 · `econ-ingestion` · 제품 CLI).
# 다른 것은 상류와 데이터 루트 둘뿐이다:
#
#   * 상류 — 고장을 주입한 피드 설정(`e2e-feeds-faults.json`). 더블의 `/__fail__/`·
#     `/__flaky__/`·`/__slow__/` 경로를 가리키는 소스가 섞여 있다.
#   * 데이터 루트 — `/data/faults`. 정상 주기가 쓰는 `/data` 와 섞이면 이미 착지한
#     ingestion 2·3·4·5 의 단정(소스별 상한·본문 확보 분포)이 이 주기의 레코드에 오염된다.
#
# `--fetch-timeout 1` 은 더블의 `/__slow__/5/` 지연보다 짧다 — 그래야 타임아웃 경로를 실제로
# 밟는다. 값을 5 이상으로 올리면 느린 소스가 그냥 성공해 시나리오의 (3)항이 관측되지 않는다.
#
# 이 Job 은 **성공(completed)하는 것이 기대값**이다. 한 소스가 끝내 실패해도 수집 전체가
# 중단되지 않는다는 것이 시나리오가 요구하는 첫 번째 기대 결과이고, 실패한 소스는 중단이
# 아니라 `failed_sources` 로 기록되는 것이 제품 동작이다.
apiVersion: batch/v1
kind: Job
metadata:
  name: econ-e2e-ingest-faults
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: ingest
          image: econ-monitor-batch:e2e
          imagePullPolicy: Never
          command: ["econ-ingestion"]
          # mock-exception: FEED-08 — 오류·지연·중복을 내는 상류로 수집 CLI를 돌린다(실 상류로는 장애 주입 자체가 불가) — docs/econ-opinion-monitor-e2e-mocking-policy.md
          args:
            - --source
            - feed
            - --feeds
            - /feeds/e2e-feeds-faults.json
            - --cycle
            - "2026-01-02T00:00"
            - --fetch-timeout
            - "1"
          env:
            - name: ECON_DATA_ROOT
              value: /data/faults
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: feeds
              mountPath: /feeds
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
        - name: feeds
          configMap:
            # mock-exception: FEED-07 — 고장 주입 피드 설정·픽스처를 같은 ConfigMap으로 주입한다(상류 재배선의 마운트 지점) — docs/econ-opinion-monitor-e2e-mocking-policy.md
            name: feed-fixtures
        - name: tmp
          emptyDir: {}
