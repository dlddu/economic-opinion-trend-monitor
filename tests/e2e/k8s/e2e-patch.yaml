# Serving reads the batch's own output on the shared claim (`k8s/batch/data-pvc.yaml`).
#
# The batch Pod writes the root serving reads while both are running: that only holds
# because they sit on the one kind node, where ReadWriteOnce still allows both mounts.
#
# Keep this additive — mount the claim *beside* the base's `data` emptyDir, never replace
# it and never add a list-replace directive: the base emptyDir is the seam prod fills.
#
# Mount read-only. A writable mount would also mean runc has to create a mountpoint
# inside it, which it cannot do.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
spec:
  template:
    spec:
      containers:
        - name: serving
          imagePullPolicy: Never
          env:
            - name: ECON_DATA_ROOT
              value: /lake/aggregation
          volumeMounts:
            - name: lake
              mountPath: /lake
              readOnly: true
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
            readOnly: true
