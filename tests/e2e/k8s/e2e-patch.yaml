# Strategic-merge patch: never pull the side-loaded image, and point the serving store
# at the aggregation batch's data root on the shared batch claim
# (`k8s/batch/data-pvc.yaml`) instead of giving serving fixture data of its own.
#
# The store reads <ECON_DATA_ROOT>/gold/*.jsonl from the filesystem on every request and
# treats missing files as empty datasets, so no restart is needed between the batch and
# the specs: the serving Pod comes up on an empty root, the aggregation chain writes Gold
# into that same directory (both Pods sit on the one kind node, so ReadWriteOnce holds),
# and by the time Playwright runs the API and the browser read the batch's own output.
#
# The claim is mounted *beside* the base's `data` emptyDir rather than replacing it —
# additive, so the base stays the deployable seam (prod fills it with its own PVC) and
# this patch needs no list-replace directive. `ECON_DATA_ROOT` is what actually decides
# which root serving reads.
#
# Why `/lake/aggregation`: every batch chain owns a data root on that one claim (run.sh
# 4a~4g), and the aggregation chain's baseline root is the one the serving screens are
# asserted against (AC3.6~3.8). Mounting the claim read-only keeps serving a reader of
# the lake — it never writes, and nothing has to create a mountpoint inside it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: econ-serving
spec:
  template:
    spec:
      containers:
        - name: serving
          imagePullPolicy: Never
          env:
            - name: ECON_DATA_ROOT
              value: /lake/aggregation
          volumeMounts:
            - name: lake
              mountPath: /lake
              readOnly: true
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: econ-e2e-batch-data
            readOnly: true
