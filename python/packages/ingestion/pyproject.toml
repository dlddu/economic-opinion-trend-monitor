[project]
name = "econ-ingestion"
version = "0.0.0"
description = "Ingestion batch — collects top news into the Bronze layer (fakes/stubs)."
requires-python = ">=3.11"
dependencies = ["econ-core"]

[project.scripts]
econ-ingestion = "econ_ingestion.cli:main"

[tool.uv.sources]
econ-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_ingestion"]
