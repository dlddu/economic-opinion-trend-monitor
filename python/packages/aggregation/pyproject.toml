[project]
name = "econ-aggregation"
version = "0.0.0"
description = "Aggregation batch — normalizes Silver into the Gold layer (fakes/stubs)."
requires-python = ">=3.11"
dependencies = ["econ-core"]

[project.scripts]
econ-aggregation = "econ_aggregation.cli:main"

[tool.uv.sources]
econ-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/econ_aggregation"]
