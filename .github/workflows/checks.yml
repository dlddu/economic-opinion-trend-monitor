# Single entry point for every PR / main check, so branch protection needs to
# require exactly one status check: `required`.
#
#   ci    -> ci.yml                   build (gen-check · lint · test), kind e2e
#   docs  -> docs-journey-mockup.yml  journey ↔ mockup structure + flow
#   image -> image.yml                publish serving/batch images; pin on main
#
# `required` runs even when a dependency fails or is skipped (`if: always()`)
# and passes only when every called workflow succeeded. Without `always()` a
# failed dependency would *skip* it, and GitHub treats a skipped required check
# as passing.
#
# Adding a check: call it here and add it to `required.needs` — nothing to
# change in branch protection.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR supersedes the previous run. main runs are never
# cancelled here (one group per SHA); image.yml keeps its own concurrency.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docs:
    uses: ./.github/workflows/docs-journey-mockup.yml

  image:
    uses: ./.github/workflows/image.yml
    # Ceiling for the called workflow: image.yml narrows it back to
    # contents: read, and only its main-only `pin` job asks for write.
    permissions:
      contents: write
      packages: write

  required:
    name: required
    if: always()
    needs: [ci, docs, image]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | any(.value.result != "success")' > /dev/null; then
            echo "::error::not every check succeeded — see the results above"
            exit 1
          fi
