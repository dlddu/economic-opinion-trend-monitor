name: CI

on:
  workflow_call:
    inputs:
      code:
        description: false 면 build · e2e 를 건너뛴다(checks.yml 의 changes 판정).
        type: boolean
        default: true

jobs:
  # `make lint` 중 docs/ 를 읽는 검사 둘. build 가 걸러지는 문서 PR 에서도 돌아야 하므로
  # 따로 떼어 항상 돌린다(build 가 도는 PR 에선 `make lint` 안에서 한 번 더 돈다).
  scenario-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Scenario <-> e2e spec mapping
        run: make lint-scenario-mapping

  # 주석 판정 원장의 행 단위 불변식 + 집계. 원장만 고치는 PR 은 code=false 로 build 가 걸러지므로
  # 여기서 돌지 않으면 원장 게이트가 그 PR 에 전혀 적용되지 않는다.
  comment-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Comment ledger invariants
        run: make lint-comment-ledger

  build:
    if: inputs.code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv (and Python)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: make setup

      - name: Codegen is up to date
        run: make gen-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Serving-path e2e on a kind cluster (batch-produced Gold -> Go API + web render).
  # Parallel to `build`; docker is preinstalled on the runner.
  #
  # arm64 on purpose, like image.yml's publish job: the e2e images are built from
  # the same Dockerfiles with the same buildx gha cache scopes (`serving`,
  # `batch`), and those scopes hold arm64 layers — main pushes keep them warm, so
  # even a PR's first run starts from cache instead of a plain `docker build`.
  e2e:
    if: inputs.code
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      E2E_CLUSTER: econ-e2e
    steps:
      - uses: actions/checkout@v4

      - name: Install kind + kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          install_only: true
          # The cluster its post step cleans up; created below under this name.
          cluster_name: econ-e2e

      # Survives past this step. The subshell's stdio is cut, otherwise the
      # runner waits for the step's output to close. The exit code lands in
      # an .rc file that "Wait for kind cluster" picks up.
      - name: Start kind cluster in background
        run: |
          mkdir -p /tmp/bg
          ( set -o pipefail
            { echo 'kind create: start'
              kind create cluster --name "$E2E_CLUSTER" --config tests/e2e/kind-config.yaml 2>&1
            } | while IFS= read -r line; do printf '%s %s\n' "$(date -u +%T.%3N)" "$line"; done \
              >/tmp/bg/kind-create.log
            echo $? >/tmp/bg/kind-create.rc ) </dev/null >/dev/null 2>&1 &

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Start Playwright setup in background
        run: |
          ( bash tests/e2e/playwright-setup.sh \
              >/tmp/bg/playwright-setup.log 2>&1; echo $? >/tmp/bg/playwright-setup.rc ) </dev/null >/dev/null 2>&1 &

      # The PR preview overlay is only ever built by Flux, so nothing else
      # would notice it rotting. Build it with the load restrictor
      # kustomize-controller uses and make sure no CronWorkflow survives: a
      # preview must never run a schedule of its own.
      - name: Preview overlay builds and carries no schedules
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/preview > /tmp/preview.yaml
          if grep -qE '^kind: CronWorkflow$' /tmp/preview.yaml; then
            echo "::error::deploy/overlays/preview renders a CronWorkflow — add a delete patch for it"
            grep -A3 -E '^kind: CronWorkflow$' /tmp/preview.yaml
            exit 1
          fi
          grep -qE '^kind: WorkflowTemplate$' /tmp/preview.yaml \
            || { echo "::error::deploy/overlays/preview lost the batch WorkflowTemplate"; exit 1; }

          # Flux retags both images to the PR head SHA through `images:`. That
          # transformer skips paths it does not know, so check that a retag
          # really reaches every image — the WorkflowTemplate included
          # (deploy/batch/kustomizeconfig.yaml). The copy sits beside the
          # overlay so its relative paths still resolve.
          sim=deploy/overlays/_preview-retag-check
          cp -r deploy/overlays/preview "$sim"
          cat >> "$sim/kustomization.yaml" <<'YAML'
          images:
            - name: ghcr.io/dlddu/economic-opinion-trend-monitor
              newTag: preview-retag-check
            - name: ghcr.io/dlddu/economic-opinion-trend-monitor-batch
              newTag: preview-retag-check
          YAML
          kubectl kustomize --load-restrictor LoadRestrictionsNone "$sim" > /tmp/preview-retag.yaml
          rm -rf "$sim"
          stale=$(grep -oE 'ghcr\.io/dlddu/economic-opinion-trend-monitor(-batch)?:[A-Za-z0-9._-]+' /tmp/preview-retag.yaml \
                    | grep -v ':preview-retag-check$' || true)
          if [ -n "$stale" ]; then
            echo "::error::images: retag did not reach these references:"
            echo "$stale"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same Dockerfiles and cache scopes as image.yml. Read-only here: the
      - name: Build serving image (econ-monitor:e2e)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: econ-monitor:e2e
          # Loaded locally only — no provenance attestation needed.
          provenance: false
          cache-from: type=gha,scope=serving

      - name: Build batch image (econ-monitor-batch:e2e)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.batch
          load: true
          tags: econ-monitor-batch:e2e
          provenance: false
          cache-from: type=gha,scope=batch

      - name: Wait for kind cluster
        run: |
          timeout 300 bash -c 'until [ -f /tmp/bg/kind-create.rc ]; do sleep 1; done'
          cat /tmp/bg/kind-create.log
          exit "$(cat /tmp/bg/kind-create.rc)"

      - name: Run kind e2e
        env:
          SKIP_BUILD: "1"
          E2E_REUSE_CLUSTER: "1"
          E2E_PLAYWRIGHT_SETUP_RC: /tmp/bg/playwright-setup.rc
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
