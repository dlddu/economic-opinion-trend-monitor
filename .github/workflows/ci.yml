name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv (and Python)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: make setup

      - name: Codegen is up to date
        run: make gen-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Serving-path e2e on a kind cluster (fixture Gold -> Go API + web render).
  # Parallel to `build`; docker is preinstalled on ubuntu-latest.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install kind + kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          install_only: true

      # The PR preview overlay is only ever built by Flux, so nothing else
      # would notice it rotting. Build it with the load restrictor
      # kustomize-controller uses and make sure no CronWorkflow survives: a
      # preview must never run a schedule of its own.
      - name: Preview overlay builds and carries no schedules
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/preview > /tmp/preview.yaml
          if grep -qE '^kind: CronWorkflow$' /tmp/preview.yaml; then
            echo "::error::deploy/overlays/preview renders a CronWorkflow — add a delete patch for it"
            grep -A3 -E '^kind: CronWorkflow$' /tmp/preview.yaml
            exit 1
          fi
          grep -qE '^kind: WorkflowTemplate$' /tmp/preview.yaml \
            || { echo "::error::deploy/overlays/preview lost the batch WorkflowTemplate"; exit 1; }

          # Flux retags both images to the PR head SHA through `images:`. That
          # transformer skips paths it does not know, so check that a retag
          # really reaches every image — the WorkflowTemplate included
          # (deploy/batch/kustomizeconfig.yaml). The copy sits beside the
          # overlay so its relative paths still resolve.
          sim=deploy/overlays/_preview-retag-check
          cp -r deploy/overlays/preview "$sim"
          cat >> "$sim/kustomization.yaml" <<'YAML'
          images:
            - name: ghcr.io/dlddu/economic-opinion-trend-monitor
              newTag: preview-retag-check
            - name: ghcr.io/dlddu/economic-opinion-trend-monitor-batch
              newTag: preview-retag-check
          YAML
          kubectl kustomize --load-restrictor LoadRestrictionsNone "$sim" > /tmp/preview-retag.yaml
          rm -rf "$sim"
          stale=$(grep -oE 'ghcr\.io/dlddu/economic-opinion-trend-monitor(-batch)?:[A-Za-z0-9._-]+' /tmp/preview-retag.yaml \
                    | grep -v ':preview-retag-check$' || true)
          if [ -n "$stale" ]; then
            echo "::error::images: retag did not reach these references:"
            echo "$stale"
            exit 1
          fi

      - name: Run kind e2e
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
