name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv (and Python)
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Install dependencies
        run: make setup

      - name: Codegen is up to date
        run: make gen-check

      - name: Lint
        run: make lint

      - name: Test
        run: make test

  # Serving-path e2e on a kind cluster (fixture Gold -> Go API + web render).
  # Parallel to `build`; docker is preinstalled on ubuntu-latest.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install kind + kubectl
        uses: helm/kind-action@v1
        with:
          version: v0.30.0
          install_only: true

      # The PR preview overlay is only ever built by Flux, so nothing else
      # would notice it rotting. Build it the way kustomize-controller does
      # (fixtures live outside the overlay) and make sure no CronWorkflow
      # survives: a preview must never run a schedule of its own.
      - name: Preview overlay builds and carries no schedules
        run: |
          kubectl kustomize --load-restrictor LoadRestrictionsNone deploy/overlays/preview > /tmp/preview.yaml
          if grep -qE '^kind: CronWorkflow$' /tmp/preview.yaml; then
            echo "::error::deploy/overlays/preview renders a CronWorkflow — add a delete patch for it"
            grep -A3 -E '^kind: CronWorkflow$' /tmp/preview.yaml
            exit 1
          fi
          grep -qE '^kind: WorkflowTemplate$' /tmp/preview.yaml \
            || { echo "::error::deploy/overlays/preview lost the batch WorkflowTemplate"; exit 1; }

      - name: Run kind e2e
        run: make e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
