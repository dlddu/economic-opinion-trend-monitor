# 사용자 여정(docs/user-journeys/JRN-*.md) ↔ 여정 mockup 페이지(docs/mockups/) 의
# 1:1 정합성 게이트. 여정 문서가 SSOT 이고, 기대값은 언제나 문서에서 파싱한다.
#
#   structure : 규칙 1~8 의 정적 판정 (stdlib python — 설치 불필요)
#   flow      : 규칙 5 (a)~(g) 를 jsdom 으로 실제 구동해 확인 (클릭·딥링크·분기)
#
# 미이관 여정은 하드 실패가 아니라 mockup 인덱스의 「규칙 1 미충족 여정 상한」 래칫으로
# 관리한다 — 늘면 실패하고, 줄면 상한을 낮추라고 실패한다.
name: docs — journey ↔ mockup

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 여정 ↔ mockup 1:1 판정
        run: python3 scripts/check-journey-mockup.py .

  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 레포에 런타임 의존성을 더하지 않는다 — 검사 때만 받는다.
      - run: npm install --no-save jsdom@29
      - name: 여정 페이지 흐름 체험(규칙 5) 실제 구동
        run: node scripts/check-journey-flow.js .
