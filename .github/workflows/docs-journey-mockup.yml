name: docs — journey ↔ mockup

on:
  workflow_call:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 여정 ↔ mockup 1:1 판정
        run: python3 scripts/check-journey-mockup.py .

  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save jsdom@29
      - name: 여정 페이지 프로토타입 충실도(규칙 5 a~h) 실제 구동
        run: node scripts/check-journey-flow.js .
