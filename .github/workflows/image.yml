# Publishes the two runtime images to GHCR so an external cluster can pull what
# deploy/ references. Each gets a moving `latest` (tracks main) and an
# immutable `sha-<commit>` pin:
#   ghcr.io/dlddu/economic-opinion-trend-monitor         serving (Dockerfile)
#     -> deploy/base/deployment.yaml
#   ghcr.io/dlddu/economic-opinion-trend-monitor-batch   batch   (Dockerfile.batch)
#     -> deploy/batch/cronjob-ingestion.yaml (AC1.1 scheduled ingestion)
name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: serving
            suffix: ""
            dockerfile: Dockerfile
          - name: batch
            suffix: "-batch"
            dockerfile: Dockerfile.batch
    name: publish (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Distinct scopes: one cache per image, so they never evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
