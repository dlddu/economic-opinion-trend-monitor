# Tags are immutable, so the default imagePullPolicy (IfNotPresent) is correct.
# Tags published earlier as `sha-<commit>` stay in the registry; nothing new is
# written in that format.
#
# No path filter on the PR path on purpose: a preview references the head SHA
# tag, so even a docs-only PR labelled `deploy/preview` needs an image at that
# SHA. Unchanged sources hit the buildx gha cache wholesale, so that costs little.
#
# main pushes do filter: a merge that reaches neither image (go/ · web/ ·
# python/ — see .dockerignore) nor the manifests (deploy/) would only mint a new
# SHA tag and restart production pods. A skipped commit never reaches `deploy`;
# the `Source-Commit:` trailer on its tip still names what production runs.
# It is an exclusion list, so a new directory triggers by default — before
# excluding a path, check that neither Dockerfile nor Flux reads it. The filter
# applies to the push trigger only; workflow_call (PRs) always runs.
name: Image

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.dockerignore'
      - '!docs/**'
      - '!scripts/**'
      - '!tests/**'
      - '!data/**'
      - '!contracts/**'
      - '!**/*_test.go'
      - '!Makefile'
      - '!README.md'
      - '!.gitignore'
      - '!.github/**'
      - '.github/workflows/image.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: serving
            suffix: ""
            dockerfile: Dockerfile
          - name: batch
            suffix: "-batch"
            dockerfile: Dockerfile.batch
    name: publish (${{ matrix.name }})
    env:
      # On pull_request, github.sha is the temporary refs/pull/N/merge commit;
      # the preview asks for the PR head, so tag and build that commit instead.
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository }}${{ matrix.suffix }}:${{ env.SHA }}
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}${{ matrix.suffix }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          # Distinct scopes: one cache per image, so they never evict each other.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  pin:
    name: pin deploy images (main only)
    # Waits for every matrix leg: both images must exist before either is pinned.
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      # The only job that pushes (to `deploy`). The workflow default stays contents: read.
      contents: write
    steps:
      # main 의 HEAD 가 아니라 방금 빌드한 커밋 그대로를 deploy 의 부모로 삼는다.
      # 전체 히스토리는 아래 「더 새 커밋이 이미 발행됐는가」 조상 판정에 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin deploy/ images to ${{ github.sha }}
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Serving and batch in one pattern: the optional group keeps the
          # `-batch` suffix inside \1, so each reference keeps its own name.
          ref='ghcr\.io/dlddu/economic-opinion-trend-monitor(-batch)?:[A-Za-z0-9._-]+'

          # Every file under deploy/ that references either image, rather than a
          # fixed list — a reference added in a new file is pinned too.
          files=$(grep -rlE "$ref" deploy/ || true)
          [ -n "$files" ] || { echo "::error::deploy/: no image references found"; exit 1; }
          # shellcheck disable=SC2086
          sed -i -E "s#(ghcr\.io/dlddu/economic-opinion-trend-monitor(-batch)?):[A-Za-z0-9._-]+#\1:${SHA}#g" $files

          # Check that sed did not silently miss: no reference may be left on
          # any other tag, and each image must be pinned at least once.
          leftover=$(grep -rhoE "$ref" deploy/ | grep -v ":${SHA}\$" || true)
          if [ -n "$leftover" ]; then
            echo "::error::deploy/: unpinned image references remain:"
            echo "$leftover"
            exit 1
          fi
          for image in economic-opinion-trend-monitor economic-opinion-trend-monitor-batch; do
            grep -rqE "ghcr\.io/dlddu/${image}:${SHA}" deploy/ \
              || { echo "::error::deploy/: ghcr.io/dlddu/${image} is not pinned anywhere"; exit 1; }
          done

          # 기본 GITHUB_TOKEN 의 push 는 새 워크플로를 트리거하지 않고, 어떤 워크플로도
          # deploy 푸시에 걸려 있지 않으므로 재귀가 없다.
          git fetch --no-tags origin +refs/heads/deploy:refs/remotes/origin/deploy 2>/dev/null || true
          old=$(git rev-parse -q --verify refs/remotes/origin/deploy || true)

          # 늦게 끝난 옛 실행이 더 새 배포를 덮지 않게 한다. deploy 끝 커밋의
          # Source-Commit 트레일러가 이 SHA 의 후손이면 이미 앞서 있으니 건너뛴다.
          # (롤백은 main 에 revert PR 을 올리는 것 — 그 머지가 새 SHA 로 다시 여기를 탄다.)
          if [ -n "$old" ]; then
            cur=$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' "$old" | tr -d '[:space:]')
            if [ -n "$cur" ] && [ "$cur" != "$SHA" ] && git merge-base --is-ancestor "$SHA" "$cur" 2>/dev/null; then
              echo "deploy 는 이미 더 새로운 main 커밋(${cur})을 가리킨다 — 건너뜀."
              exit 0
            fi
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -a --allow-empty \
            -m "deploy: econ-monitor 이미지를 ${SHA} 로 고정" \
            -m "Source-Commit: ${SHA}"

          # lease 로 「읽은 뒤 누가 먼저 밀었으면」 실패시킨다(old 가 비면 = 브랜치가 없어야 함).
          git push --force-with-lease="refs/heads/deploy:${old}" origin HEAD:refs/heads/deploy
